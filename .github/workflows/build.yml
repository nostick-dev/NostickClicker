name: Build APK from ZIP

# يعمل يدويًا فقط من تبويب Actions
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Unzip project and build APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "لم يتم العثور على أي ملف ZIP داخل المستودع."
            echo "ارفع ملف NostickClicker-ready.zip أولًا إلى المستودع."
            exit 1
          fi

          echo "ZIP found: ${ZIP_FILE}"
          rm -rf extracted-project
          mkdir -p extracted-project
          unzip -q "${ZIP_FILE}" -d extracted-project

          PROJECT_DIR="$(find extracted-project -type f -name 'build.gradle' -o -name 'build.gradle.kts' | head -n 1 | xargs -r dirname)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "لم يتم العثور على build.gradle داخل ملف ZIP."
            find extracted-project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project directory: ${PROJECT_DIR}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NostickClicker-debug-apk
          path: extracted-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
